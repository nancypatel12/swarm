# Render's free plan puts the API to sleep after 15 minutes without visitors, and the next visitor then waits about
# a minute. A light request every 10 minutes keeps it awake through judging. Set the repository variable API_URL to
# the API's address to turn it on.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 30 "${{ vars.API_URL }}/api/health"
